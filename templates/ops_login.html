{% extends "base.html" %}
{% set title = '员工后台登录' %}
{% block content %}
<section class="card narrow"><h1>员工后台登录</h1><p class="muted">供副管理员、组长和组员登录使用。</p><form method="post" class="form"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>用户名</label><input name="username" required autocomplete="username"><label>密码</label><input type="password" name="password" required autocomplete="current-password"><button type="submit">登录</button></form></section>
{% endblock %}
